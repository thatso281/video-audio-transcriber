name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload confidential media, transcripts, credentials, or model files.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact steps that reproduce the problem.
      placeholder: |
        1. Open the app
        2. Select...
        3. Click...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 64-bit
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.13.13
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: FFmpeg version
      placeholder: Paste the first line of ffmpeg -version
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Processing device
      options:
        - Auto
        - CPU
        - CUDA
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Whisper model
      placeholder: small
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Full error message
      render: text
  - type: textarea
    id: additional
    attributes:
      label: Additional context
